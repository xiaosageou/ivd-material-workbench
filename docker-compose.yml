services:
  ivd-workbench:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      IVD_EMBEDDING_API_KEY: ${IVD_EMBEDDING_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ivd-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  ivd-ai-worker:
    build: .
    command: ["node", "--experimental-strip-types", "src/ai-worker.ts"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      IVD_AI_API_KEY: ${IVD_AI_API_KEY:-}
    volumes:
      - ivd-data:/app/data
    depends_on:
      ivd-workbench:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--experimental-strip-types", "src/ai-worker-health.ts"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    expose:
      - "6333"
    volumes:
      - qdrant-data:/qdrant/storage

  ivd-literature-worker:
    build: .
    command: ["node", "--experimental-strip-types", "src/literature-worker.ts"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      IVD_EMBEDDING_API_KEY: ${IVD_EMBEDDING_API_KEY:-}
      IVD_EMBEDDING_BASE_URL: ${IVD_EMBEDDING_BASE_URL:-}
      IVD_EMBEDDING_MODEL: ${IVD_EMBEDDING_MODEL:-}
      IVD_EMBEDDING_DIMENSIONS: ${IVD_EMBEDDING_DIMENSIONS:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ivd-data:/app/data
    depends_on:
      ivd-workbench:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "--experimental-strip-types", "src/literature-worker-health.ts"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  ivd-report-knowledge-worker:
    build: .
    command: ["node", "--experimental-strip-types", "src/report-knowledge-worker.ts"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      IVD_EMBEDDING_API_KEY: ${IVD_EMBEDDING_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ivd-data:/app/data
    depends_on:
      ivd-workbench:
        condition: service_healthy
      qdrant:
        condition: service_started

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ivd-workbench:
        condition: service_healthy

volumes:
  ivd-data:
  qdrant-data:
  caddy-data:
  caddy-config:
